<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who Owes Whom Emotionally?</title>
<link rel="stylesheet" href="assets/y2k.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>🧾</text></svg>">
<style>
  .ledger th.me { background:var(--hotpink); }
  .ledger th.them { background:#2a9dff; }
  .balance { display:flex; align-items:center; gap:12px; margin:14px 0 4px; }
  .balance .side { flex:1; text-align:center; padding:10px; border-radius:6px; border:3px solid #fff; box-shadow:2px 2px 0 rgba(120,0,90,.25); }
  .balance .side b { display:block; font-family:'VT323','Courier New',ui-monospace,monospace; font-size:34px; }
  .balance .me { background:linear-gradient(180deg,#ffa6dd,var(--hotpink)); color:#fff; }
  .balance .them { background:linear-gradient(180deg,#9fd4ff,#2a9dff); color:#fff; }
  .balance .vs { font-family:'VT323','Courier New',ui-monospace,monospace; font-size:26px; }
</style>
</head>
<body>
<script src="assets/y2k.js"></script>
<script>
(function () {
  var ITEMS = [
    { k: 'airport',  label: '🛫 airport pickups / drop-offs', w: 8 },
    { k: 'breakup',  label: '💔 3am breakup phone calls',     w: 10 },
    { k: 'moving',   label: '📦 helping someone move',        w: 14 },
    { k: 'bday',     label: '🎂 remembered birthdays properly', w: 5 },
    { k: 'crisis',   label: '🚑 showed up in a real crisis',  w: 18 },
    { k: 'money',    label: '💵 lent money without being weird about it', w: 12 },
    { k: 'listen',   label: '👂 hours of listening to the same problem', w: 6 },
    { k: 'travel',   label: '✈️ travelled to visit the other', w: 9 },
    { k: 'plans',    label: '📅 organized the plans / the group', w: 4 },
    { k: 'hard',     label: '🪞 said the hard, true thing kindly', w: 11 }
  ];

  function rowHTML(it) {
    return '<tr><td>' + it.label + '</td>' +
      '<td style="width:92px"><input data-k="' + it.k + '" data-side="me" type="number" min="0" step="1" value="0"></td>' +
      '<td style="width:92px"><input data-k="' + it.k + '" data-side="them" type="number" min="0" step="1" value="0"></td></tr>';
  }

  Y2K.app({
    title: 'Who Owes Whom Emotionally?',
    emoji: '🧾🫂',
    file: 'friendship_ledger',
    sub: 'A friendship ledger for airport pickups, breakup calls, moving help, and <em>birthday effort</em>. Double-entry bookkeeping for feelings.',
    intro: 'Pick one friend. Count the last five years, roughly. Nobody is auditing you except you, at 1am, which is worse.',
    button: '✧ BALANCE THE BOOKS ✧',
    meterLabel: 'balance — 50 is even, above 50 means they owe you',
    loaderLines: ['RECONCILING FIVE YEARS OF FAVORS ...', 'APPLYING 3AM PHONE CALL MULTIPLIER ...', 'WARNING: LEDGERS ARE A BAD WAY TO LOVE PEOPLE ...'],
    ticker: 'the healthiest friendships keep terrible records',

    fields: [
      { id: 'name', type: 'text', label: 'Which friend?', placeholder: 'e.g. Sam' },
      { type: 'html', html:
        '<div class="field"><span class="field__legend">The ledger' +
        '<span class="field__hint">Count of times, over roughly the last five years. Left column: things you did for them. Right column: things they did for you.</span></span>' +
        '<div class="tablewrap"><table class="table ledger"><thead><tr>' +
        '<th>the deed</th><th class="me">I did</th><th class="them">they did</th>' +
        '</tr></thead><tbody>' + ITEMS.map(rowHTML).join('') + '</tbody></table></div></div>' },
      { id: 'ease', type: 'slider', min: 0, max: 10, default: 7,
        label: 'How easy is it to ask them for something?', ticks: ['I never would', 'immediately, no thought'] },
      { id: 'keeping', type: 'slider', min: 0, max: 10, default: 5,
        label: 'How much do you find yourself keeping score?', ticks: ['never', 'constantly'] },
      { id: 'capacity', type: 'choice', label: 'Their life circumstances over this period:',
        options: [
          { v: 0, label: 'stable and easy' }, { v: 1, label: 'normal ups and downs' },
          { v: 2, label: 'genuinely hard years' }, { v: 3, label: 'crisis, illness, or caregiving' }
        ], default: 1 },
      { id: 'mycap', type: 'choice', label: 'Your circumstances over this period:',
        options: [
          { v: 0, label: 'stable and easy' }, { v: 1, label: 'normal ups and downs' },
          { v: 2, label: 'genuinely hard years' }, { v: 3, label: 'crisis, illness, or caregiving' }
        ], default: 1 }
    ],

    collect: function (form) {
      var me = 0, them = 0, lines = [];
      ITEMS.forEach(function (it) {
        var a = parseFloat(form.querySelector('[data-k="' + it.k + '"][data-side="me"]').value) || 0;
        var b = parseFloat(form.querySelector('[data-k="' + it.k + '"][data-side="them"]').value) || 0;
        me += a * it.w; them += b * it.w;
        if (a || b) lines.push({ it: it, a: a, b: b, va: a * it.w, vb: b * it.w });
      });
      return { meTotal: me, themTotal: them, lines: lines };
    },

    compute: function (v) {
      var name = (v.name || '').trim() || 'them';
      var me = v.meTotal, them = v.themTotal;
      if (me + them === 0) {
        return { score: 50, scoreText: '0', vibe: 'mid', title: 'An empty ledger',
          blurb: 'Either nothing has ever happened between you, or you did not fill in the table. Both are fixable.',
          advice: 'Put some numbers in the grid.' };
      }
      // capacity adjustment: someone in crisis owes less
      var capAdj = (v.capacity - v.mycap) * 0.09;
      var adjThem = them * (1 + Math.max(0, capAdj));
      var total = me + adjThem;
      var score = Y2K.clamp((adjThem / total) * 100, 2, 98);   // >50 = they gave more = they are owed less...
      // reframe: balance from YOUR perspective — how much they owe you
      var owedToMe = Y2K.clamp(((me - adjThem) / total) * 100 + 50, 2, 98);
      var vibe = Math.abs(owedToMe - 50) < 12 ? 'good' : Math.abs(owedToMe - 50) < 28 ? 'mid' : 'bad';

      var rows = v.lines.sort(function (x, y) { return Math.abs(y.va - y.vb) - Math.abs(x.va - x.vb); })
        .map(function (l) {
          var d = l.va - l.vb;
          return '<tr><td>' + l.it.label + '</td><td>' + l.a + '</td><td>' + l.b + '</td>' +
            '<td>' + (Math.abs(d) < 1 ? 'even' : (d > 0 ? 'you +' + Math.round(d) : Y2K.esc(name) + ' +' + Math.round(-d))) + '</td></tr>';
        }).join('');
      var table = '<div class="subhead">📒 line by line</div><div class="tablewrap"><table class="table"><thead><tr>' +
        '<th>deed</th><th>you</th><th>them</th><th>net</th></tr></thead><tbody>' + rows + '</tbody></table></div>';

      var bal = '<div class="balance"><div class="side me"><b>' + Math.round(me) + '</b>you gave</div>' +
        '<div class="vs">vs</div><div class="side them"><b>' + Math.round(adjThem) + '</b>' + Y2K.esc(name) + ' gave</div></div>';

      var biggest = v.lines.slice().sort(function (x, y) { return Math.abs(y.va - y.vb) - Math.abs(x.va - x.vb); })[0];

      var receipts = [
        { vibe: Math.abs(owedToMe - 50) < 12 ? 'good' : 'mid',
          t: 'Net position: <b>' + (Math.abs(owedToMe - 50) < 12 ? 'even' :
             owedToMe > 50 ? Y2K.esc(name) + ' owes you ' + Math.round(owedToMe - 50) + ' points' :
             'you owe ' + Y2K.esc(name) + ' ' + Math.round(50 - owedToMe) + ' points') + '</b>. ' +
             (Math.abs(owedToMe - 50) < 12 ? 'That is well inside the margin of error for human memory, which reliably overweights what we gave and underweights what we received.' : '') },
        { vibe: 'mid',
          t: biggest ? 'Biggest single imbalance: <b>' + biggest.it.label + '</b> — ' +
             (biggest.va > biggest.vb ? 'you ' + biggest.a + ', them ' + biggest.b : 'them ' + biggest.b + ', you ' + biggest.a) +
             '. Most ledger resentment traces back to one category, not a general deficit.' : '' },
        { vibe: v.capacity >= 2 ? 'good' : 'mid',
          t: v.capacity >= 2 ? 'They have had genuinely hard years. We weighted their contributions up by ' + Math.round(Math.max(0, capAdj) * 100) +
             '% — capacity is not the same as willingness, and a friend at 40% capacity giving you everything they have is not in your debt.'
             : 'Their circumstances have been stable, so the raw numbers stand.' },
        { vibe: v.ease >= 7 ? 'good' : 'bad',
          t: 'You rated the ease of asking them for something at <b>' + v.ease + '/10</b>. ' +
             (v.ease >= 7 ? 'This is the only metric on this page that predicts anything. A friendship where asking is easy is solvent regardless of the ledger.'
                          : 'If asking is hard, the balance is almost irrelevant — an unusable credit is not an asset. That is the thing to fix, not the count.') },
        { vibe: v.keeping >= 7 ? 'bad' : 'good',
          t: 'You keep score at <b>' + v.keeping + '/10</b>. ' +
             (v.keeping >= 7 ? 'Score-keeping is usually a symptom rather than a cause: people start counting when they have stopped feeling secure. The count is not the problem you are trying to solve.'
                             : 'Low score-keeping. Healthy — you built this ledger for fun and you can now close it.') }
      ];

      return {
        score: owedToMe, vibe: vibe,
        title: Math.abs(owedToMe - 50) < 12 ? 'The books balance.' :
               owedToMe > 50 ? Y2K.esc(name) + ' is in your debt.' : 'You are in ' + Y2K.esc(name) + "'s debt.",
        blurb: Math.abs(owedToMe - 50) < 12
          ? 'Across five years and ten categories, you two are within noise of even. Whatever prompted you to open this app, it was probably not accounting.'
          : owedToMe > 50
            ? 'You have given more, meaningfully. Worth knowing — and worth saying out loud once, to them, rather than tallying quietly for another five years.'
            : 'They have given more. That is not a debt to feel bad about, it is a prompt: pick one item from their column and return it this month, unprompted.',
        stats: [
          { k: 'you gave', v: Math.round(me) },
          { k: 'they gave', v: Math.round(adjThem) },
          { k: 'net', v: (owedToMe > 50 ? '+' : '') + Math.round(owedToMe - 50) },
          { k: 'ease of asking', v: v.ease + '/10' }
        ],
        receipts: receipts,
        extra: bal + table + '<p class="note" style="margin-top:12px">Real friendships run permanent, unbalanced, mutually-forgiven debt. ' +
               'The goal is not a zero balance — it is a line of credit that both people trust.</p>',
        advice: Math.abs(owedToMe - 50) < 12
          ? 'Close the ledger. Text them something nice with no favor attached.'
          : owedToMe > 50
            ? 'Do not present this. Instead, ask them for something specific and slightly inconvenient. A friendship in credit is only worth anything if you draw on it — and most people are relieved to be asked.'
            : 'Repay one thing this month, concretely. Airport run, moving day, or the 3am call. It clears more than it costs.'
      };
    }
  });
})();
</script>
</body>
</html>
